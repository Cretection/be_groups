---
name: CI

# Quality gates of be_groups, see CODING_GUIDELINES.md, §14.
#
# Every "runTests.sh" call passes "-b docker": the script prefers podman whenever
# it is installed, but podman is not reliable on the GitHub hosted runners (database
# containers of the functional tests are not reachable), while docker is.
#
# Actions are pinned to commit SHAs, Dependabot keeps them up to date.

on:
  push:
    branches:
      - main
      - relaunch
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly run to detect breaking changes in (development) dependencies early
    - cron: '17 4 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cache dependencies installed with composer
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: "static-php-8.2-composer-${{ hashFiles('composer.json') }}"
          path: .cache/composer
          restore-keys: "static-php-8.2-composer-"
      - name: Install composer dependencies
        run: Build/Scripts/runTests.sh -b docker -p 8.2 -s composerUpdateMax
      - name: Check composer.json normalization
        run: Build/Scripts/runTests.sh -b docker -p 8.2 -s composerNormalize -n
      - name: Verify PSR-4 autoloading
        run: Build/Scripts/runTests.sh -b docker -p 8.2 -s psrVerify
      - name: Lint PHP, JSON and YAML
        run: Build/Scripts/runTests.sh -b docker -p 8.2 -s lint
      - name: Check the code style and the license headers
        run: Build/Scripts/runTests.sh -b docker -p 8.2 -s cgl -n
      - name: Check for changes proposed by Rector
        run: Build/Scripts/runTests.sh -b docker -p 8.2 -s rector -n
      - name: PHPStan (level max, no baseline)
        run: Build/Scripts/runTests.sh -b docker -p 8.2 -s phpstan
      - name: PHP integrity checks
        run: Build/Scripts/runTests.sh -b docker -p 8.2 -s integrity
      - name: XLIFF integrity
        run: Build/Scripts/runTests.sh -b docker -p 8.2 -s xliffLint
      - name: XLIFF formatting
        run: Build/Scripts/runTests.sh -b docker -p 8.2 -s xliffNormalize -n
      - name: Shellcheck runTests.sh
        run: Build/Scripts/runTests.sh -b docker -s shellcheck

  unit:
    name: Unit tests (PHP ${{ matrix.php-version }}, ${{ matrix.composer-dependencies }} dependencies)
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.2', '8.3', '8.4', '8.5']
        composer-dependencies: ['Min', 'Max']
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cache dependencies installed with composer
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: "unit-php-${{ matrix.php-version }}-${{ matrix.composer-dependencies }}-composer-${{ hashFiles('composer.json') }}"
          path: .cache/composer
          restore-keys: "unit-php-${{ matrix.php-version }}-${{ matrix.composer-dependencies }}-composer-"
      - name: Install composer dependencies
        run: Build/Scripts/runTests.sh -b docker -p ${{ matrix.php-version }} -s composerUpdate${{ matrix.composer-dependencies }}
      - name: Run the unit tests
        run: Build/Scripts/runTests.sh -b docker -p ${{ matrix.php-version }} -s unit

  functional:
    name: Functional tests (PHP ${{ matrix.php-version }}, ${{ matrix.dbms }}${{ matrix.dbms-version && format(' {0}', matrix.dbms-version) || '' }}${{ matrix.driver && format(' {0}', matrix.driver) || '' }})
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - php-version: '8.2'
            dbms: sqlite
          - php-version: '8.5'
            dbms: sqlite
          - php-version: '8.5'
            dbms: mariadb
            dbms-version: '10.11'
          - php-version: '8.5'
            dbms: mariadb
            dbms-version: '11.8'
          - php-version: '8.5'
            dbms: mariadb
            dbms-version: '11.8'
            driver: pdo_mysql
          - php-version: '8.5'
            dbms: mysql
            dbms-version: '8.0'
          - php-version: '8.5'
            dbms: mysql
            dbms-version: '8.4'
          - php-version: '8.5'
            dbms: mysql
            dbms-version: '8.4'
            driver: pdo_mysql
          - php-version: '8.5'
            dbms: postgres
            dbms-version: '14'
          - php-version: '8.5'
            dbms: postgres
            dbms-version: '18'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cache dependencies installed with composer
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: "functional-php-${{ matrix.php-version }}-composer-${{ hashFiles('composer.json') }}"
          path: .cache/composer
          restore-keys: "functional-php-${{ matrix.php-version }}-composer-"
      - name: Install composer dependencies
        run: Build/Scripts/runTests.sh -b docker -p ${{ matrix.php-version }} -s composerUpdateMax
      - name: Run the functional tests
        env:
          PHP_VERSION: ${{ matrix.php-version }}
          DBMS: ${{ matrix.dbms }}
          DBMS_VERSION: ${{ matrix.dbms-version }}
          DRIVER: ${{ matrix.driver }}
        run: |
          OPTIONS=(-d "${DBMS}")
          if [ -n "${DBMS_VERSION}" ]; then OPTIONS+=(-i "${DBMS_VERSION}"); fi
          if [ -n "${DRIVER}" ]; then OPTIONS+=(-a "${DRIVER}"); fi
          Build/Scripts/runTests.sh -b docker -p "${PHP_VERSION}" -s functional "${OPTIONS[@]}"

  docs:
    name: Documentation rendering
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Render the documentation (warnings fail the build)
        run: Build/Scripts/runTests.sh -b docker -s docs

  typo3-next:
    name: Unit and functional tests against TYPO3 v15-dev
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    # The development version of the core changes daily. A failure does not block merging,
    # but has to be fixed before the next release (RELAUNCH.md, compatibility policy).
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the development version of TYPO3 v15
        run: Build/Scripts/runTests.sh -b docker -p 8.5 -s composerUpdateDev
      - name: Unit tests
        run: Build/Scripts/runTests.sh -b docker -p 8.5 -s unit
      - name: Functional tests (SQLite)
        run: Build/Scripts/runTests.sh -b docker -p 8.5 -s functional -d sqlite

  e2e:
    name: End-to-end tests with accessibility checks
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cache dependencies installed with composer and npm
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: "e2e-composer-npm-${{ hashFiles('composer.json', 'Build/package-lock.json') }}"
          path: |
            .cache/composer
            .cache/.npm
          restore-keys: "e2e-composer-npm-"
      - name: Run the end-to-end tests in the light and the dark theme
        run: Build/Scripts/runTests.sh -b docker -p 8.5 -s e2e
      - name: Upload the report of failed tests
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-report
          path: |
            .Build/logs/playwright-report
            .Build/logs/playwright-results
            .Build/logs/e2e-*.log
          if-no-files-found: ignore

  mutation:
    name: Mutation tests (Domain and DataHandling)
    # The mutants run one after another and take more than an hour, so the job runs weekly and
    # on demand. It has to be green before every release (CONTRIBUTING.md).
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-26.04
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cache dependencies installed with composer
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: "mutation-php-8.5-composer-${{ hashFiles('composer.json') }}"
          path: .cache/composer
          restore-keys: "mutation-php-8.5-composer-"
      - name: Install composer dependencies
        run: Build/Scripts/runTests.sh -b docker -p 8.5 -s composerUpdateMax
      - name: Run Infection (minimum MSI 80 %)
        run: Build/Scripts/runTests.sh -b docker -p 8.5 -s mutation
      - name: Upload the reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation
          path: |
            .Build/logs/infection.log
            .Build/logs/infection-summary.log
          if-no-files-found: ignore

  coverage:
    name: Code coverage (unit and functional tests)
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cache dependencies installed with composer
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: "coverage-php-8.5-composer-${{ hashFiles('composer.json') }}"
          path: .cache/composer
          restore-keys: "coverage-php-8.5-composer-"
      - name: Install composer dependencies
        run: Build/Scripts/runTests.sh -b docker -p 8.5 -s composerUpdateMax
      - name: Unit tests with coverage
        run: Build/Scripts/runTests.sh -b docker -p 8.5 -s unit -m
      - name: Functional tests with coverage (SQLite)
        run: Build/Scripts/runTests.sh -b docker -p 8.5 -s functional -d sqlite -m
      - name: Merge the coverage of both suites
        run: Build/Scripts/runTests.sh -b docker -p 8.5 -s coverageMerge
      - name: Show the summary
        run: |
          {
            echo '### Code coverage (unit and functional tests)'
            echo
            echo '```'
            sed -n '/Summary:/,/^$/p' .Build/logs/coverage.txt
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
      - name: Check the minimum coverage of Classes/
        run: Build/Scripts/runTests.sh -b docker -p 8.5 -s coverageCheck
      - name: Upload the reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: |
            .Build/logs/clover.xml
            .Build/logs/coverage.txt
          if-no-files-found: error

  required:
    # The only check the ruleset of "main" requires: it fails unless every job above passed
    # that has to pass, so the ruleset does not need to change with the matrices. Not part
    # of it: "typo3-next" (allowed to fail) and "mutation" (only scheduled or manual).
    name: Required checks
    if: always()
    needs:
      - static
      - unit
      - functional
      - docs
      - e2e
      - coverage
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Check that all required jobs passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: ${RESULTS}"
          for result in ${RESULTS}; do
            [ "${result}" = success ] || exit 1
          done
