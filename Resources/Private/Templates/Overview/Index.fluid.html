<html
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:be="http://typo3.org/ns/TYPO3/CMS/Backend/ViewHelpers"
    xmlns:core="http://typo3.org/ns/TYPO3/CMS/Core/ViewHelpers"
    data-namespace-typo3-fluid="true"
>
<f:layout name="Module" />

<f:section name="Content">
    <h1><f:translate key="title" domain="be_groups.modules.overview" /></h1>
    <p><f:translate key="intro" domain="be_groups.modules.overview" /></p>

    <f:if condition="{overview.issueCount}">
        <f:be.infobox
            state="{f:constant(name: 'TYPO3\CMS\Core\Type\ContextualFeedbackSeverity::WARNING')}"
            title="{f:translate(key: 'issues.title', domain: 'be_groups.modules.overview')}"
        >
            <p><f:translate key="issues.message" domain="be_groups.modules.overview" arguments="{0: overview.issueCount}" /></p>
        </f:be.infobox>
    </f:if>

    <f:render section="Toolbar" arguments="{_all}" />
    <f:render section="Roles" arguments="{_all}" />
    <f:render section="BuildingBlocks" arguments="{_all}" />
    <f:render section="ClassicGroups" arguments="{_all}" />
    <f:render section="UnknownKindGroups" arguments="{_all}" />
</f:section>

<f:section name="Toolbar">
    <nav class="mb-4" aria-label="{f:translate(key: 'toolbar.label', domain: 'be_groups.modules.overview')}">
        <div class="d-flex flex-wrap gap-3 align-items-center">
            <span id="begroups-sorting-label"><f:translate key="sorting.label" domain="be_groups.modules.overview" /></span>
            <div class="btn-group" role="group" aria-labelledby="begroups-sorting-label">
                <f:for each="{sortings}" as="sortingOption">
                    <a
                        href="{f:be.uri(route: moduleIdentifier, parameters: {sorting: sortingOption, kind: kindFilter})}"
                        class="btn btn-default {f:if(condition: '{sorting} == {sortingOption}', then: 'active')}"
                        aria-current="{f:if(condition: '{sorting} == {sortingOption}', then: 'true', else: 'false')}"
                    ><f:translate key="sorting.{sortingOption}" domain="be_groups.modules.overview" /></a>
                </f:for>
            </div>

            <span id="begroups-filter-label"><f:translate key="filter.label" domain="be_groups.modules.overview" /></span>
            <div class="btn-group flex-wrap" role="group" aria-labelledby="begroups-filter-label">
                <a
                    href="{f:be.uri(route: moduleIdentifier, parameters: {sorting: sorting, kind: ''})}"
                    class="btn btn-default {f:if(condition: '!{kindFilter}', then: 'active')}"
                    aria-current="{f:if(condition: '!{kindFilter}', then: 'true', else: 'false')}"
                ><f:translate key="filter.all" domain="be_groups.modules.overview" /></a>
                <f:for each="{overview.buildingBlockKinds}" as="kindDefinition">
                    <a
                        href="{f:be.uri(route: moduleIdentifier, parameters: {sorting: sorting, kind: kindDefinition.value})}"
                        class="btn btn-default {f:if(condition: '{kindFilter} == {kindDefinition.value}', then: 'active')}"
                        aria-current="{f:if(condition: '{kindFilter} == {kindDefinition.value}', then: 'true', else: 'false')}"
                    >{kindDefinition.label}</a>
                </f:for>
            </div>
        </div>
    </nav>
</f:section>

<f:section name="Roles">
    <h2><f:translate key="roles.heading" domain="be_groups.modules.overview" /> <span class="badge badge-info">{overview.roles -> f:count()}</span></h2>
    <f:if condition="{overview.roles}">
        <f:then>
            <div class="table-fit">
                <table class="table table-striped table-hover">
                    <caption class="visually-hidden"><f:translate key="roles.caption" domain="be_groups.modules.overview" /></caption>
                    <thead>
                        <tr>
                            <th scope="col"><f:translate key="column.role" domain="be_groups.modules.overview" /></th>
                            <th scope="col"><f:translate key="column.buildingBlocks" domain="be_groups.modules.overview" /></th>
                            <th scope="col"><f:translate key="column.users" domain="be_groups.modules.overview" /></th>
                        </tr>
                    </thead>
                    <tbody>
                        <f:for each="{overview.roles}" as="role">
                            <tr>
                                <th scope="row"><f:render section="Group" arguments="{group: role.group, returnUrl: returnUrl}" /></th>
                                <td>
                                    <f:for each="{role.buildingBlocks}" as="kindGroups">
                                        <div class="mb-1">
                                            <core:icon identifier="{kindGroups.iconIdentifier}" size="small" />
                                            <strong>{kindGroups.label}:</strong>
                                            <f:for each="{kindGroups.groups}" as="buildingBlock" iteration="iterator">
                                                <f:render section="GroupLink" arguments="{group: buildingBlock, returnUrl: returnUrl}" /><f:if condition="!{iterator.isLast}">, </f:if>
                                            </f:for>
                                        </div>
                                    </f:for>
                                    <f:for each="{role.invalidMembers}" as="invalidMember">
                                        <div class="mb-1">
                                            <span class="badge badge-danger"><f:translate key="issue.invalidMember" domain="be_groups.modules.overview" /></span>
                                            <f:render section="GroupLink" arguments="{group: invalidMember, returnUrl: returnUrl}" />
                                        </div>
                                    </f:for>
                                    <f:for each="{role.missingMemberUids}" as="missingUid">
                                        <div class="mb-1"><span class="badge badge-danger"><f:translate key="issue.missingMember" domain="be_groups.modules.overview" arguments="{0: missingUid}" /></span></div>
                                    </f:for>
                                    <f:if condition="!{role.buildingBlocks} && !{role.invalidMembers} && !{role.missingMemberUids}">
                                        <span class="text-body-secondary"><f:translate key="label.none" domain="be_groups.modules.overview" /></span>
                                    </f:if>
                                </td>
                                <td><f:render section="UserList" arguments="{users: role.users, returnUrl: returnUrl}" /></td>
                            </tr>
                        </f:for>
                    </tbody>
                </table>
            </div>
        </f:then>
        <f:else>
            <p><f:translate key="roles.empty" domain="be_groups.modules.overview" /></p>
        </f:else>
    </f:if>
</f:section>

<f:section name="BuildingBlocks">
    <h2><f:translate key="buildingBlocks.heading" domain="be_groups.modules.overview" /></h2>
    <f:for each="{overview.buildingBlockSections}" as="section">
        <h3>
            <core:icon identifier="{section.iconIdentifier}" size="small" />
            {section.label}
            <span class="badge badge-info">{section.buildingBlocks -> f:count()}</span>
        </h3>
        <div class="table-fit">
            <table class="table table-striped table-hover">
                <caption class="visually-hidden">
                    <f:translate key="buildingBlocks.caption" domain="be_groups.modules.overview" arguments="{0: section.label}" />
                </caption>
                <thead>
                    <tr>
                        <th scope="col"><f:translate key="column.buildingBlock" domain="be_groups.modules.overview" /></th>
                        <th scope="col"><f:translate key="column.usedIn" domain="be_groups.modules.overview" /></th>
                        <th scope="col"><f:translate key="column.directUsers" domain="be_groups.modules.overview" /></th>
                    </tr>
                </thead>
                <tbody>
                    <f:for each="{section.buildingBlocks}" as="buildingBlock">
                        <tr>
                            <th scope="row">
                                <f:render section="Group" arguments="{group: buildingBlock.group, returnUrl: returnUrl}" />
                                <f:if condition="{buildingBlock.unused}">
                                    <span class="badge badge-default"><f:translate key="label.unused" domain="be_groups.modules.overview" /></span>
                                </f:if>
                                <f:if condition="{buildingBlock.hasSubgroups}">
                                    <span class="badge badge-danger"><f:translate key="issue.buildingBlockWithSubgroups" domain="be_groups.modules.overview" /></span>
                                </f:if>
                            </th>
                            <td>
                                <f:for each="{buildingBlock.roles}" as="usingGroup" iteration="iterator">
                                    <f:render section="GroupLink" arguments="{group: usingGroup, returnUrl: returnUrl, withIcon: 1}" /><f:if condition="!{iterator.isLast}">, </f:if>
                                </f:for>
                                <f:if condition="{buildingBlock.roles} && {buildingBlock.otherGroups}">, </f:if>
                                <f:for each="{buildingBlock.otherGroups}" as="usingGroup" iteration="iterator">
                                    <f:render section="GroupLink" arguments="{group: usingGroup, returnUrl: returnUrl, withIcon: 1}" /><f:if condition="!{iterator.isLast}">, </f:if>
                                </f:for>
                                <f:if condition="!{buildingBlock.roles} && !{buildingBlock.otherGroups}">
                                    <span class="text-body-secondary"><f:translate key="label.none" domain="be_groups.modules.overview" /></span>
                                </f:if>
                            </td>
                            <td>
                                <f:if condition="{buildingBlock.directUsers}">
                                    <f:then>
                                        <p class="mb-1"><span class="badge badge-warning"><f:translate key="issue.directUsers" domain="be_groups.modules.overview" /></span></p>
                                        <f:render section="UserList" arguments="{users: buildingBlock.directUsers, returnUrl: returnUrl}" />
                                    </f:then>
                                    <f:else>
                                        <span class="text-body-secondary"><f:translate key="label.none" domain="be_groups.modules.overview" /></span>
                                    </f:else>
                                </f:if>
                            </td>
                        </tr>
                    </f:for>
                </tbody>
            </table>
        </div>
    </f:for>
    <f:if condition="!{overview.buildingBlockSections}">
        <p><f:translate key="buildingBlocks.empty" domain="be_groups.modules.overview" /></p>
    </f:if>
</f:section>

<f:section name="ClassicGroups">
    <f:if condition="{overview.classicGroups}">
        <h2><f:translate key="classic.heading" domain="be_groups.modules.overview" /> <span class="badge badge-info">{overview.classicGroups -> f:count()}</span></h2>
        <f:if condition="{classicGroupsAllowed}">
            <f:then>
                <p><f:translate key="classic.description" domain="be_groups.modules.overview" /></p>
            </f:then>
            <f:else>
                <f:be.infobox
                    state="{f:constant(name: 'TYPO3\CMS\Core\Type\ContextualFeedbackSeverity::WARNING')}"
                    title="{f:translate(key: 'classicDisabled.title', domain: 'be_groups.modules.overview')}"
                >
                    <p><f:translate key="classicDisabled.message" domain="be_groups.modules.overview" /></p>
                </f:be.infobox>
            </f:else>
        </f:if>
        <ul class="list-unstyled">
            <f:for each="{overview.classicGroups}" as="classicGroup">
                <li class="mb-1"><f:render section="Group" arguments="{group: classicGroup, returnUrl: returnUrl}" /></li>
            </f:for>
        </ul>
    </f:if>
</f:section>

<f:section name="UnknownKindGroups">
    <f:if condition="{overview.unknownKindGroups}">
        <h2><f:translate key="unknownKind.heading" domain="be_groups.modules.overview" /> <span class="badge badge-warning">{overview.unknownKindGroups -> f:count()}</span></h2>
        <f:be.infobox
            state="{f:constant(name: 'TYPO3\CMS\Core\Type\ContextualFeedbackSeverity::WARNING')}"
            title="{f:translate(key: 'unknownKind.title', domain: 'be_groups.modules.overview')}"
        >
            <p><f:translate key="unknownKind.message" domain="be_groups.modules.overview" /></p>
        </f:be.infobox>
        <ul class="list-unstyled">
            <f:for each="{overview.unknownKindGroups}" as="unknownKindGroup">
                <li class="mb-1">
                    <f:render section="Group" arguments="{group: unknownKindGroup, returnUrl: returnUrl}" />
                    <span class="badge badge-warning"><f:translate key="unknownKind.badge" domain="be_groups.modules.overview" arguments="{0: unknownKindGroup.kind}" /></span>
                </li>
            </f:for>
        </ul>
    </f:if>
</f:section>

<f:section name="Group">
    <core:icon identifier="{group.iconIdentifier}" size="small" />
    <f:render section="GroupLink" arguments="{group: group, returnUrl: returnUrl}" />
    <f:if condition="{group.hidden}">
        <span class="badge badge-default"><f:translate key="label.hidden" domain="be_groups.modules.overview" /></span>
    </f:if>
</f:section>

<f:section name="GroupLink">
    <f:if condition="{withIcon}"><core:icon identifier="{group.iconIdentifier}" size="small" /></f:if>
    <be:link.editRecord
        uid="{group.uid}"
        table="be_groups"
        returnUrl="{returnUrl}"
        title="{f:translate(key: 'label.edit', domain: 'be_groups.modules.overview', arguments: {0: group.title})}"
    >{group.title}</be:link.editRecord>
</f:section>

<f:section name="UserList">
    <f:if condition="{users}">
        <f:then>
            <ul class="list-unstyled mb-0">
                <f:for each="{users}" as="user">
                    <li>
                        <core:icon identifier="actions-user" size="small" />
                        <be:link.editRecord
                            uid="{user.uid}"
                            table="be_users"
                            returnUrl="{returnUrl}"
                            title="{f:translate(key: 'label.edit', domain: 'be_groups.modules.overview', arguments: {0: user.username})}"
                        >{user.username}</be:link.editRecord>
                        <f:if condition="{user.realName}"><span class="text-body-secondary">({user.realName})</span></f:if>
                        <f:if condition="{user.disabled}">
                            <span class="badge badge-default"><f:translate key="label.userDisabled" domain="be_groups.modules.overview" /></span>
                        </f:if>
                    </li>
                </f:for>
            </ul>
        </f:then>
        <f:else>
            <span class="text-body-secondary"><f:translate key="label.none" domain="be_groups.modules.overview" /></span>
        </f:else>
    </f:if>
</f:section>
</html>
