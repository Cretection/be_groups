---
name: Crowdin

# Uploads the English labels to the Crowdin project of TYPO3 after a change on "main"
# (https://docs.typo3.org/permalink/t3coreapi:crowdin-extension-integration). Translations
# reach TYPO3 installations as language packs; German is maintained in this repository.
#
# Needs the secrets CROWDIN_PROJECT_ID and CROWDIN_PERSONAL_TOKEN; without them the upload is
# skipped. Actions are pinned to commit SHAs, Dependabot keeps them up to date.

on:
  push:
    branches:
      - main
    paths:
      - 'Resources/Private/Language/**.xlf'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    name: Upload the sources to Crowdin
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    env:
      CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
      CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
    steps:
      - name: Checkout
        if: env.CROWDIN_PROJECT_ID != '' && env.CROWDIN_PERSONAL_TOKEN != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Upload the sources (only one Crowdin branch, "main", is supported by TYPO3)
        if: env.CROWDIN_PROJECT_ID != '' && env.CROWDIN_PERSONAL_TOKEN != ''
        uses: crowdin/github-action@9af557de76d70c480f88065d336f445a362f402b # v3.1.0
        with:
          config: '.crowdin.yml'
          project_id: ${{ env.CROWDIN_PROJECT_ID }}
          token: ${{ env.CROWDIN_PERSONAL_TOKEN }}
          crowdin_branch_name: 'main'
          upload_sources: true
          upload_translations: false
          download_sources: false
          download_translations: false
